<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>កម្មវិធីបែងចែក និងគ្រប់គ្រងកាលវិភាគបង្រៀនគ្រូ</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="កាលវិភាគបង្រៀន">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

  <!-- Google Fonts for Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS file -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Pre-embedded styles for instant flicker-free rendering -->
  <style>
    :root {
      --font-main: 'Kantumruy Pro', system-ui, -apple-system, sans-serif;
      --font-title: 'Moul', 'Kantumruy Pro', serif;
      --font-body: 'Battambang', 'Kantumruy Pro', sans-serif;
    }
    body {
      font-family: var(--font-main);
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .font-moul { font-family: var(--font-title); }
    .font-kantumruy { font-family: var(--font-main); }
    .font-battambang { font-family: var(--font-body); }
    .timetable-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
    }
    .timetable-table th, .timetable-table td {
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      text-align: center;
      padding: 4px 6px;
      transition: all 0.15s ease-in-out;
    }
    .timetable-table th:first-child, .timetable-table td:first-child { border-left: 1px solid #cbd5e1; }
    .timetable-table tr:first-child th { border-top: 1px solid #cbd5e1; }
    .day-sep-left { border-left: 2px solid #64748b !important; }
    .cell-slot {
      cursor: pointer;
      position: relative;
      font-size: 0.85rem;
      font-weight: 600;
      min-width: 38px;
      height: 32px;
    }
    .cell-slot:hover {
      filter: brightness(0.92);
      transform: scale(1.04);
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .cell-dimmed { opacity: 0.25 !important; filter: grayscale(80%) !important; }
    .cell-highlighted {
      outline: 3px solid #2563eb !important;
      outline-offset: -2px;
      font-weight: 800 !important;
      transform: scale(1.08);
      z-index: 20;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4) !important;
    }
    .badge-subject {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .teacher-slip-card {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .labor-cell {
      background: #ffedd5 !important;
      color: #9a3412 !important;
      font-weight: 700;
      letter-spacing: 2px;
    }
    /* Mobile app bottom nav padding */
    .pb-mobile-nav {
      padding-bottom: 5.5rem;
    }
    @media (min-width: 768px) {
      .pb-mobile-nav {
        padding-bottom: 1.5rem;
      }
    }
    @media print {
      @page { size: A4 portrait; margin: 10mm 10mm 10mm 10mm; }
      body { background: white !important; color: black !important; font-size: 9pt; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .teacher-slip-card {
        border: 1px solid #000 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 8mm 6mm !important;
        margin-bottom: 10mm !important;
        page-break-inside: avoid;
      }
      .page-break { page-break-after: always !important; break-after: page !important; }
      .timetable-table { border-collapse: collapse !important; width: 100% !important; }
      .timetable-table th, .timetable-table td {
        border: 1px solid #000 !important;
        padding: 3px 4px !important;
        font-size: 8.5pt !important;
        color: #000 !important;
      }
      .timetable-table th {
        background-color: #f1f5f9 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .day-sep-left { border-left: 2px solid #000 !important; }
      .labor-cell {
        background: #fed7aa !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>

  <!-- Server Pre-Rendered Data for Instant Loading -->
  <script>
    window.INITIAL_DATA = {{ initial_data | safe }};
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Printable Container (Hidden on screen, shown during print) -->
  <div id="printable-area" class="hidden print-only"></div>

  <!-- Screen Content (Hidden on print) -->
  <div class="no-print">
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5">
        <div class="flex items-center justify-between gap-2">
          <!-- Logo & Title -->
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 text-white flex items-center justify-center font-black text-xl shadow-md shadow-blue-500/20 shrink-0">
              📅
            </div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-[10px] sm:text-xs font-bold text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200 truncate">
                  ក្រសួងអប់រំ យុវជន និងកីឡា
                </span>
                <span id="connection-status-badge" class="text-[10px] sm:text-xs font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200 flex items-center gap-1">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span id="connection-status-text">អនឡាញ</span>
                </span>
              </div>
              <h1 class="text-sm sm:text-lg font-black text-slate-900 tracking-tight truncate mt-0.5">
                កាលវិភាគបង្រៀនគ្រូ
              </h1>
            </div>
          </div>

          <!-- Role Switcher & Action Buttons -->
          <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <!-- PWA Install Button (Dynamic) -->
            <button
              id="btn-pwa-install"
              onclick="installPWA()"
              class="hidden px-2.5 py-1.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs font-bold rounded-lg shadow-sm hover:from-amber-600 hover:to-orange-600 flex items-center gap-1 transition animate-bounce"
              title="ដំឡើងកម្មវិធីលើទូរស័ព្ទដៃ"
            >
              <span>📲</span>
              <span class="hidden sm:inline">ដំឡើង App</span>
            </button>

            <!-- User Role Badge Button -->
            <button
              id="role-switch-btn"
              onclick="openRoleModal()"
              class="px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-sm transition"
              title="ចុចដើម្បីប្តូរសិទ្ធិប្រើប្រាស់"
            >
              <span id="role-badge-icon">👤</span>
              <span id="role-badge-text" class="truncate max-w-[100px] sm:max-w-none">សិស្ស</span>
              <span class="text-[10px] text-slate-400">▼</span>
            </button>
          </div>
        </div>

        <!-- Desktop Navigation Tabs (Hidden on small mobile) -->
        <nav class="hidden md:flex space-x-1 sm:space-x-2 border-t border-slate-100 mt-2.5 pt-2 overflow-x-auto text-xs sm:text-sm font-semibold">
          <button
            data-tab="teachers"
            class="tab-btn px-3 py-2 border-b-2 border-blue-600 text-blue-600 bg-blue-50 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>👨‍🏫</span> កាលវិភាគគ្រូបង្រៀន
          </button>
          <button
            data-tab="classes"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>🏫</span> កាលវិភាគតាមថ្នាក់រៀន
          </button>
          <button
            data-tab="subject_teachers"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>👥</span> បញ្ជីឈ្មោះគ្រូមុខវិជ្ជា
          </button>
          <button
            data-tab="homeroom_manager"
            id="tab-btn-homeroom"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>🎯</span> កែនាមគ្រូបន្ទុកថ្នាក់
          </button>
          <button
            data-tab="master"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>📋</span> តារាងម៉ោងរួម (Master)
          </button>
          <button
            data-tab="workload"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>📊</span> ស្ថិតិ និងបន្ទុកម៉ោង
          </button>
          <button
            data-tab="print_hub"
            class="tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 hover:text-slate-800 rounded-t-lg transition flex items-center gap-1.5 whitespace-nowrap"
          >
            <span>🖨️</span> បោះពុម្ព & ទាញយក Excel
          </button>
        </nav>
      </div>
    </header>

    <!-- Main Content Container with bottom padding for mobile navigation -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 pb-mobile-nav">
      <div id="tab-content">
        <!-- Rendered dynamically -->
        <div class="py-20 text-center">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
          <p class="mt-3 text-sm text-slate-500 font-medium">កំពុងដំណើរការទាញយកទិន្នន័យកាលវិភាគ...</p>
        </div>
      </div>
    </main>

    <!-- Desktop Footer -->
    <footer class="hidden md:block bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500">
      <div class="max-w-7xl mx-auto px-4 space-y-1">
        <p class="font-semibold text-slate-700">កម្មវិធីបែងចែកកាលវិភាគបង្រៀនជូនលោកគ្រូ-អ្នកគ្រូ | ឆ្នាំសិក្សា ២០២៦ - ២០២៧</p>
        <p>គាំទ្រការគ្រប់គ្រងគ្រូបន្ទុកថ្នាក់ បញ្ជីឈ្មោះគ្រូមុខវិជ្ជា និងបោះពុម្ពបណ្ណកាលវិភាគ</p>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation Bar (Fixed for mobile phones) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 py-1.5 flex justify-around items-center shadow-lg">
      <button
        data-tab="teachers"
        class="tab-btn flex flex-col items-center py-1 px-2 text-blue-600 font-bold transition active:scale-95"
      >
        <span class="text-xl">👨‍🏫</span>
        <span class="text-[10px] mt-0.5">គ្រូបង្រៀន</span>
      </button>
      <button
        data-tab="classes"
        class="tab-btn flex flex-col items-center py-1 px-2 text-slate-500 font-semibold transition active:scale-95"
      >
        <span class="text-xl">🏫</span>
        <span class="text-[10px] mt-0.5">តាមថ្នាក់</span>
      </button>
      <button
        data-tab="master"
        class="tab-btn flex flex-col items-center py-1 px-2 text-slate-500 font-semibold transition active:scale-95"
      >
        <span class="text-xl">📋</span>
        <span class="text-[10px] mt-0.5">តារាងរួម</span>
      </button>
      <button
        data-tab="subject_teachers"
        class="tab-btn flex flex-col items-center py-1 px-2 text-slate-500 font-semibold transition active:scale-95"
      >
        <span class="text-xl">👥</span>
        <span class="text-[10px] mt-0.5">បញ្ជីគ្រូ</span>
      </button>
      <button
        onclick="openRoleModal()"
        class="flex flex-col items-center py-1 px-2 text-slate-500 font-semibold transition active:scale-95"
      >
        <span class="text-xl" id="bottom-nav-role-icon">👤</span>
        <span class="text-[10px] mt-0.5" id="bottom-nav-role-label">សិទ្ធិ</span>
      </button>
    </nav>
  </div>

  <!-- Role Switcher & Login Modal -->
  <div id="role-modal" class="hidden"></div>

  <!-- General Edit Modal Container -->
  <div id="edit-modal"></div>

  <!-- App JavaScript with CDN / API Fallback -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    // Resilient fallback in case Vercel CDN static route fails:
    if (typeof appState === 'undefined') {
      console.warn('static/js/app.js did not load. Falling back to /api/app.js...');
      var fallback = document.createElement('script');
      fallback.src = '/api/app.js';
      document.body.appendChild(fallback);
    }

    // Register Service Worker for PWA & Offline Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('✅ ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('⚠️ ServiceWorker registration failed:', err);
        });
      });
    }

    // PWA Install Prompt Listener
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btn-pwa-install');
      if (btn) btn.classList.remove('hidden');
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('User installed the PWA');
          }
          deferredPrompt = null;
          const btn = document.getElementById('btn-pwa-install');
          if (btn) btn.classList.add('hidden');
        });
      } else {
        alert('📱 របៀបដំឡើងកម្មវិធីលើទូរស័ព្ទដៃ ៖\n\n- លើ Android (Google Chrome) ៖ ចុចសញ្ញាចុច ៣ (⋮) នៅជ្រុងលើខាងស្តាំ -> ជ្រើសរើស "Install app" ឬ "Add to Home screen"\n\n- លើ iPhone / iPad (Safari) ៖ ចុចប៊ូតុង Share (📤) នៅខាងក្រោម -> អូសចុះក្រោមជ្រើសរើស "Add to Home Screen"');
      }
    }
  </script>
</body>
</html>
